<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>±</text></svg>" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Habit Scorecard</title>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
		<script>
			// Prevent flash of incorrect theme
			try {
				const theme = localStorage.getItem('theme') || 'dark';
				if (theme === 'dark') {
					document.documentElement.classList.add('dark');
				} else {
					document.documentElement.classList.remove('dark');
				}
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="h-full bg-white text-black dark:bg-black dark:text-white antialiased font-sans selection:bg-black selection:text-white dark:selection:bg-white dark:selection:text-black transition-colors duration-150">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
